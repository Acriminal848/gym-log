<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F6F7">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gym Log">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>Gym Log</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="update-banner" hidden></div>
  <main id="view">
    <p class="loading">กำลังเปิดแอป…</p>
  </main>
  <nav id="tabs" aria-label="เมนูหลัก"></nav>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="rest-bar" role="timer" aria-label="ตัวจับเวลาพัก" hidden></div>
  <div id="rest-live" class="sr-only" role="status" aria-live="polite"></div>
  <div id="kb-bar"><button type="button" data-action="kb-done">เสร็จ</button></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><p style="padding:16px">แอปนี้ต้องเปิด JavaScript</p></noscript>

  <script src="storage.js"></script>
  <script src="progression.js"></script>
  <script src="summary.js"></script>
  <script src="icons.js"></script>
  <script src="program.js"></script>
  <script src="core.js"></script>
  <script src="rest.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
</body>
</html>
